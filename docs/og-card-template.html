<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #050506;
    font-family: 'Outfit', system-ui, sans-serif;
    color: #EFECE3;
    position: relative;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
  .g1 { width: 620px; height: 620px; top: -240px; left: -180px; background: rgba(242,61,48,0.28); }
  .g2 { width: 560px; height: 560px; bottom: -260px; right: -140px; background: rgba(227,168,78,0.22); }
  .g3 { width: 420px; height: 420px; top: 40%; left: 45%; background: rgba(94,106,210,0.16); }
  .grain { position: absolute; inset: 0; opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .frame { position: absolute; inset: 34px; border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; }
  .wrap { position: relative; height: 100%; padding: 92px 88px; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 20px; letter-spacing: 0.22em;
    text-transform: uppercase; color: #E3A84E; margin-bottom: 26px; }
  .name { font-weight: 900; font-size: 132px; line-height: 0.9; letter-spacing: -0.03em; text-transform: uppercase;
    background: linear-gradient(100deg, #EFECE3 16%, #E3A84E 46%, #F23D30 66%, #EFECE3 92%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .tag { margin-top: 30px; font-size: 30px; font-weight: 400; color: #98A0AC; max-width: 900px; }
  .row { position: absolute; left: 88px; right: 88px; bottom: 74px; display: flex; align-items: center; justify-content: space-between; }
  .dots { display: flex; gap: 12px; }
  .dot { width: 22px; height: 22px; border-radius: 7px; }
  .domain { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 24px; color: #EFECE3; opacity: 0.85; }
</style>
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="glow g3"></div>
  <div class="grain"></div>
  <div class="frame"></div>
  <div class="wrap">
    <div class="eyebrow">Developer &amp; filmmaker &nbsp;·&nbsp; Nice, France</div>
    <div class="name">Tristan<br />Grech</div>
    <div class="tag">Websites, web apps &amp; booking &nbsp;·&nbsp; AI visibility audits &nbsp;·&nbsp; Video &amp; podcast</div>
  </div>
  <div class="row">
    <div class="dots">
      <span class="dot" style="background:#F23D30"></span>
      <span class="dot" style="background:#38BDF8"></span>
      <span class="dot" style="background:#FB923C"></span>
      <span class="dot" style="background:#A78BFA"></span>
      <span class="dot" style="background:#34D399"></span>
      <span class="dot" style="background:#818CF8"></span>
      <span class="dot" style="background:#E3A84E"></span>
      <span class="dot" style="background:#E11D48"></span>
    </div>
    <div class="domain">tristangrech.com</div>
  </div>
</body>
</html>
